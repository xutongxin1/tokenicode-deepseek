name: Build Windows Release (from xtx)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (leave blank for auto dev-YYYYMMDD-HHMM)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create as draft release?'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - release-exe

permissions:
  contents: write

jobs:
  # One job, one `tauri build` — the release .exe, .msi and .nsis installer
  # are all products of the same build, so separate jobs would compile twice
  # for nothing. All assets land in a single GitHub Release.
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -- determine version ------------------------------------------------
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            TAG_VER="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG_VER="dev-$(date +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          else
            TAG_VER="dev-$(date +%Y%m%d-%H%M)"
          fi
          # semver-safe version string for tauri.conf.json / Cargo.toml
          # must be MAJOR.MINOR.PATCH[-prerelease]; the msi (WiX) target
          # requires the pre-release identifier to be numeric-only and <= 65535,
          # so "0.0.0-dev" fails bundling — use "0.0.0-1" instead.
          SEMVER="0.0.0-1"
          # Build timestamp (Asia/Shanghai) shown in the window title
          BUILD_TS="$(TZ=Asia/Shanghai date +%Y%m%d%H%M)"
          echo "tag=$TAG_VER" >> $GITHUB_OUTPUT
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT
          echo "build_ts=$BUILD_TS" >> $GITHUB_OUTPUT
          echo "release_name=TOKENICODE-from-xtx $TAG_VER" >> $GITHUB_OUTPUT

      # -- inject "from xtx" branding into config ---------------------------
      - name: Patch branding into configs
        shell: bash
        run: |
          # 1. tauri.conf.json — product name + window title.
          #    plugins.updater is removed: this is a standalone build without
          #    update checks (lib.rs only registers the updater plugin when the
          #    config section exists, so this cannot crash at startup).
          node -e "
          const fs = require('fs');
          const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json','utf8'));
          conf.productName = 'TOKENICODE-from-xtx';
          conf.version = '${{ steps.version.outputs.semver }}';
          conf.app.windows[0].title = 'TOKENICODE from xtx ${{ steps.version.outputs.build_ts }}';
          conf.bundle.createUpdaterArtifacts = false;
          delete conf.plugins.updater;
          fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
          console.log('tauri.conf.json patched:', conf.productName, conf.version);
          "

          # 2. Cargo.toml — version + description (for .exe metadata)
          node -e "
          const fs = require('fs');
          let cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          cargo = cargo.replace(/^version = \".*\"$/m, 'version = \"${{ steps.version.outputs.semver }}\"');
          cargo = cargo.replace(/^description = \".*\"$/m, 'description = \"TOKENICODE DeepSeek Alpha from xtx\"');
          fs.writeFileSync('src-tauri/Cargo.toml', cargo);
          console.log('Cargo.toml patched');
          "

      # -- toolchain --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # -- build ------------------------------------------------------------
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (EXE + MSI + NSIS)
        shell: bash
        env:
          EDITION: dev
        run: |
          # NSIS download may time out; the .exe and .msi are already built by then
          pnpm tauri build --bundles msi,nsis 2>&1 || true

          echo "--- built artifacts ---"
          ls -lh src-tauri/target/release/tokenicode.exe
          ls -lh src-tauri/target/release/bundle/msi/ 2>/dev/null || echo "(no msi)"
          ls -lh src-tauri/target/release/bundle/nsis/ 2>/dev/null || echo "(no nsis)"

      # -- prepare release assets -------------------------------------------
      - name: Gather release assets
        id: gather
        shell: bash
        run: |
          mkdir -p release-assets
          VER="${{ steps.version.outputs.tag }}"

          # standalone exe (same binary as the installer payload, no installer)
          EXE="src-tauri/target/release/tokenicode.exe"
          if [ -f "$EXE" ]; then
            cp "$EXE" "release-assets/TOKENICODE-from-xtx-standalone.exe"
          fi

          # msi installer
          MSI_DIR="src-tauri/target/release/bundle/msi"
          if [ -d "$MSI_DIR" ]; then
            for f in "$MSI_DIR"/*.msi; do
              [ -f "$f" ] && cp "$f" "release-assets/"
            done
          fi

          # nsis installer (may not exist if NSIS download failed)
          NSIS_DIR="src-tauri/target/release/bundle/nsis"
          if [ -d "$NSIS_DIR" ]; then
            for f in "$NSIS_DIR"/*.exe; do
              [ -f "$f" ] && cp "$f" "release-assets/"
            done
          fi

          echo "--- release assets ---"
          ls -lh release-assets/

          # set output for empty check
          COUNT=$(ls release-assets/ 2>/dev/null | wc -l)
          echo "asset_count=$COUNT" >> $GITHUB_OUTPUT

      # -- create release ---------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          body: |
            ## 🔧 TOKENICODE from xtx — 自动构建

            **版本**: `${{ steps.version.outputs.tag }}`
            **平台**: Windows x64

            ### 📦 包含文件
            - `TOKENICODE-from-xtx-standalone.exe` — 独立可执行文件，免安装直接运行
            - `*.msi` — Windows 安装包
            - `*-setup.exe` — NSIS 安装程序（NSIS 下载失败时缺失）

            > 🏷️ 此版本由 GitHub Actions 自动构建，from xtx。
          draft: ${{ inputs.draft || false }}
          prerelease: true
          files: release-assets/*
          fail_on_unmatched_files: ${{ steps.gather.outputs.asset_count != '0' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
